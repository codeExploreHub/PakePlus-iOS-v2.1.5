
<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>Ultimate Merry Christmas Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: 'Playfair Display', serif; }
      canvas { display: block; }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .gold-text {
        background: linear-gradient(to bottom, #fceea7, #d4af37, #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .ui-hidden {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.5s ease;
      }
      @keyframes gold-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .spinner {
        border: 2px solid transparent;
        border-top: 2px solid #d4af37;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: gold-spin 1s linear infinite;
      }
    </style>
